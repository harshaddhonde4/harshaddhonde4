<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Harshad Dhonde - Full-Stack Engineer, AI and RAG Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.45"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#dots)"/>

    <!-- back wave -->
    <g opacity="0.14" fill="#ffffff">
      <path d="M0 200 Q150 160 300 200 T600 200 T900 200 T1200 200 T1500 200 T1800 200 V260 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- front wave -->
    <g opacity="0.22" fill="#ffffff">
      <path d="M-600 222 Q-450 192 -300 222 T0 222 T300 222 T600 222 T900 222 T1200 222 V260 H-600 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="600 0" dur="10s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle" fill="#ffffff">
      <text x="600" y="118" font-size="68" font-weight="800" letter-spacing="1" filter="url(#shadow)">Harshad Dhonde
        <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      </text>
      <text x="600" y="163" font-size="24" font-weight="600" letter-spacing="3" filter="url(#shadow)">FULL-STACK ENGINEER  ·  AI &amp; RAG BUILDER
        <animate attributeName="opacity" from="0" to="1" dur="1.8s" fill="freeze"/>
      </text>
      <text x="600" y="198" font-size="17" font-weight="500" opacity="0.92" letter-spacing="1">Pune, India  ·  Open to Internships &amp; Collaborations</text>
    </g>
  </g>
</svg>
